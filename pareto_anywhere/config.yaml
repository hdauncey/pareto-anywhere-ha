name: Pareto Anywhere
version: "2.0.0"
slug: pareto_anywhere
description: reelyActive Pareto Anywhere IoT middleware, ingesting BLE data from HPE Aruba APs via IoT Transport (WebSocket)
url: https://www.reelyactive.com/pareto/anywhere/
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: Web apps, APIs, Socket.IO (Node-RED) and Aruba IoT Transport WebSocket (/aruba)
webui: "http://[HOST]:[PORT:3001]/"
watchdog: "tcp://[HOST]:[PORT:3001]"
options: {}
schema: {}
